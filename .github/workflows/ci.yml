name: CI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Type checking the integration needs Home Assistant, which needs 3.14.
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy -p remon_home_integration
      - run: uv run mypy -p custom_components.remon
      - run: uv run mypy tests
      - run: uv run mypy tests_ha

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what current Home Assistant runs on; 3.12 keeps the client usable standalone.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest --cov

  test-home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: >-
          uv run pytest tests_ha -o addopts="--strict-markers"
          --cov --cov-config=tests_ha/.coveragerc

  # The oldest Home Assistant hacs.json allows. Its aiohttp pin (3.11.13) was yanked from PyPI,
  # so the next patch release stands in for it.
  test-home-assistant-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          activate-environment: true
      - run: echo "aiohttp==3.11.14" > "$RUNNER_TEMP/overrides.txt"
      - run: >-
          uv pip install --override "$RUNNER_TEMP/overrides.txt"
          "pytest-homeassistant-custom-component==0.13.221"
      - run: python -m pytest tests_ha -o addopts="--strict-markers"
